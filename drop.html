<!doctype html><meta charset="utf-8"><meta name="robots" content="noindex"><title>drop</title>
<body style="background:#111;color:#eee;font:16px sans-serif;padding:20px">Хүлээж байна…
<script>
// Түр хуудас: Gemini-ийн табаас постер хүлээн авч Supabase руу илгээнэ.
window.addEventListener("message", async (e) => {
  if (e.origin !== "https://gemini.google.com" || !e.data || !e.data.files) return;
  document.body.textContent = "Илгээж байна: " + e.data.files.length;
  const res = [];
  for (const f of e.data.files) {
    try {
      const r = await fetch("https://ynntwvbgpmfghaqwibdm.supabase.co/functions/v1/poster-drop", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ key: e.data.key, files: [f] }) });
      res.push(await r.text());
    } catch (err) { res.push("fail " + f.name + " " + err.message); }
  }
  document.body.textContent = res.join("\n");
  try { e.source.postMessage({ done: res }, e.origin); } catch {}
  setTimeout(() => window.close(), 1500);
});
if (window.opener) window.opener.postMessage({ ready: true }, "https://gemini.google.com");
</script>
