name: pull-gemini
on: workflow_dispatch
permissions:
  contents: write
jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p posters/raw
          for i in $(seq 1 12); do curl -fsSL "https://ynntwvbgpmfghaqwibdm.supabase.co/storage/v1/object/public/posters/gemini/g$i.jpg" -o posters/raw/g$i.jpg; done
          ls -la posters/raw
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posters/raw && git commit -m "Gemini постерын эх зураг" && git push
